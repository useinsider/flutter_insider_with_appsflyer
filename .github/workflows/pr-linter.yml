name: PR Linter

on:
  pull_request:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - reopened
      - converted_to_draft
      - ready_for_review
      - synchronize

concurrency:
  group: pr-linter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  pr-linter:
    uses: useinsider/pr-linter/.github/workflows/pr-linter.yml@main
