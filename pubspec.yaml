name: flutter_insider
description: Flutter plugin wrapping the Insider mobile SDK for user tracking, custom events, push notifications, smart recommendations, App Cards, and App Frames.
version: 5.3.0+nh
homepage: https://insiderone.com/
issue_tracker: https://github.com/useinsider/FlutterDemo/issues
documentation: https://pub.dev/documentation/flutter_insider/latest/

environment:
  sdk: '>=2.15.0 <4.0.0'
  # App Frames embeds the native view with PlatformViewsService.initExpensiveAndroidView,
  # which was added in Flutter 3.0.
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.useinsider.insider.flutter_insider
        pluginClass: FlutterInsiderPlugin
      ios:
        pluginClass: FlutterInsiderPlugin
